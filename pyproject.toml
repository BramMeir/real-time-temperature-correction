[tool.poetry]
name = "real-time-temperature-correction"
version = "0.1.0"
description = "Real-time correction of temperature measurements in urban sensor networks using regression with seasonal ARIMA errors"
authors = ["Bram Meir <Bram.Meir@ugent.be>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
pandas = "^2.3.3"
scikit-learn = "^1.7.2"
matplotlib = "^3.10.7"
statsmodels = "^0.14.5"
numpy = ">=2.1.0"
scikit-optimize = "^0.10.2"
tensorflow = "^2.20.0"
keras-tuner = "^1.4.8"
keras-tcn = "^3.5.6"
scikeras = "^0.13.0"
xarray = "^2026.1.0"
netcdf4 = "^1.7.4"
geopandas = "^1.1.3"
contextily = "^1.7.0"
matplotlib-scalebar = "^0.9.0"
rasterio = ">=1.3,<1.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
